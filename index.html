function openCatalogModal(){state.catalogStore=state.currentStore||STORES[0];state.catalogSearch='';renderCatalogModal();document.getElementById('modal-overlay').style.display='flex';}
function renderCatalogModal(){
  const box=document.getElementById('modal-box');
  box.style.maxWidth='640px';
  box.innerHTML=`
    <div class="modal-title">📋 Staples Catalog</div>
    <p style="color:var(--text-muted);font-size:13px;margin-bottom:14px;line-height:1.5">Your master list of household items. Toggle checkboxes to add or remove from this week's shopping list.</p>
    <div id="cat-store-pills" style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      ${STORES.map(s=>{const active=state.catalogStore===s;const sc=STORE_COLOR[s]||'#555';const total=state.items.filter(it=>it.store===s).length;const onListCount=state.items.filter(it=>it.store===s&&state.onList[it.id]).length;return `<button class="cat-store-pill" style="border-color:${sc};background:${active?sc:'white'};color:${active?'white':sc}" onclick="setCatalogStore('${esc(s)}')">${esc(s)}<br><small style="font-weight:400;font-size:10px;opacity:.9">${onListCount}/${total} on list</small></button>`;}).join('')}
    </div>

    <div id="cat-items" style="max-height:400px;overflow-y:auto;margin-bottom:16px;border:1px solid var(--border);border-radius:10px;padding:4px">${renderCatalogItems(true)}</div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><button class="btn btn-sm btn-secondary" onclick="catalogToggleAll(true)">Add All to List</button><button class="btn btn-sm btn-secondary" onclick="catalogToggleAll(false)">Clear All from List</button></div>
    <div style="display:flex;gap:10px"><button class="btn btn-primary" style="flex:1" onclick="closeCatalog()">Done</button></div>`;
}
function setCatalogStore(s){state.catalogStore=s;renderCatalogModal();}
function renderCatalogItems(returnOnly){
  const q=(state.catalogSearch||'').toLowerCase().trim();
  const storeItems=state.items.filter(it=>it.store===state.catalogStore);
  const filtered=q?storeItems.filter(it=>it.name.toLowerCase().includes(q)):storeItems;
  const grouped={};
  for(const c of (STORE_CATS[state.catalogStore]||[])){grouped[c]=[];}
  for(const it of filtered){if(!grouped[it.category])grouped[it.category]=[];grouped[it.category].push(it);}
  let html='';
  for(const cat of Object.keys(grouped)){
    const items=grouped[cat];
    if(!items.length)continue;
    const cc=CAT_COLOR[cat]||'#666';
    items.sort((a,b)=>a.name.localeCompare(b.name));
    html+=`<div class="cat-section-group"><div class="cat-section-head" style="color:${cc}"><span class="cat-section-bar" style="background:${cc}"></span>${esc(cat)} <span style="color:var(--text-muted);font-weight:500">· ${items.length}</span></div>`;
    for(const it of items){
      const onList=!!state.onList[it.id];
      const stats=getPurchaseStats(purchaseKey(it));
      const timesLabel=stats?` · bought ${stats.count}×`:'';
      html+=`<label class="cat-item-row${onList?' on-list':''}" data-item-id="${it.id}">
        <input type="checkbox" ${onList?'checked':''} onchange="toggleCatalog('${it.id}',this.checked)" style="width:18px;height:18px;accent-color:${cc};cursor:pointer;flex-shrink:0">
        <div style="flex:1;min-width:0"><div class="cat-item-name">${esc(it.name)}</div><div class="cat-item-meta">${fmtQty(it.qty)} ${esc(it.unit||'')}${timesLabel}</div></div>
        <button class="btn-icon" onclick="editCatalogItem('${it.id}',event)" title="Edit" style="font-size:14px">✏️</button>
        <button class="btn-icon" onclick="deleteCatalogItem('${it.id}',event)" title="Delete permanently" style="color:#DC2626;font-size:14px">🗑</button>
      </label>`;
    }
    html+='</div>';
  }
  if(!html){html=`<div class="empty" style="padding:30px 20px"><div class="msg">No items ${q?'match':'in this store'}</div>${q?'<div class="sub">Try a different search</div>':'<div class="sub">Click "Add Item" to build your catalog</div>'}</div>`;}
  if(returnOnly)return html;
  const el=document.getElementById('cat-items');
  if(el)el.innerHTML=html;
}
function toggleCatalog(id,on){
  state.onList[id]=on;
  persist();
  const row=document.querySelector(`#cat-items .cat-item-row[data-item-id="${id}"]`);
  if(row)row.classList.toggle('on-list',on);
  refreshCatalogStorePills();
  renderShop();
}
function refreshCatalogStorePills(){
  const pillRow=document.getElementById('cat-store-pills');
  if(!pillRow)return;
  pillRow.innerHTML=STORES.map(s=>{
    const active=state.catalogStore===s;
    const sc=STORE_COLOR[s]||'#555';
    const total=state.items.filter(it=>it.store===s).length;
    const onListCount=state.items.filter(it=>it.store===s&&state.onList[it.id]).length;
    return `<button class="cat-store-pill" style="border-color:${sc};background:${active?sc:'white'};color:${active?'white':sc}" onclick="setCatalogStore('${esc(s)}')">${esc(s)}<br><small style="font-weight:400;font-size:10px;opacity:.9">${onListCount}/${total} on list</small></button>`;
  }).join('');
}
function catalogToggleAll(onState){
  const storeItems=state.items.filter(it=>it.store===state.catalogStore);
  const q=(state.catalogSearch||'').toLowerCase().trim();
  const target=q?storeItems.filter(it=>it.name.toLowerCase().includes(q)):storeItems;
  for(const it of target)state.onList[it.id]=onState;
  persist();renderCatalogModal();renderShop();
  toast(onState?`${target.length} item${target.length!==1?'s':''} added`:`${target.length} item${target.length!==1?'s':''} removed from list`);
}
function editCatalogItem(id,ev){
  ev.preventDefault();ev.stopPropagation();
  const item=state.items.find(i=>i.id===id);
  if(!item)return;
  closeCatalog();openModal('editItem',item);
}
function deleteCatalogItem(id,ev){
  ev.preventDefault();ev.stopPropagation();
  const item=state.items.find(i=>i.id===id);
  if(!item)return;
  if(!confirm(`Permanently delete "${item.name}" from the catalog?\n\nThis also removes purchase history for this item.`))return;
  state.items=state.items.filter(i=>i.id!==id);
  delete state.onList[id];
  const key=purchaseKey(item);
  if(state.purchases[key])delete state.purchases[key];
  if(state.dismissed[key])delete state.dismissed[key];
  persist();renderCatalogModal();renderShop();
  toast(`${item.name} deleted from catalog`);
}
function closeCatalog(){const box=document.getElementById('modal-box');if(box)box.style.maxWidth='';closeModal();}

        <div class="cloud-step-title">Download a backup</div>
        <div class="cloud-step-desc">Saves a <code>.json</code> file with all your data. Do this on your live site first, before changing anything.</div>
        <button class="btn btn-primary btn-sm" onclick="downloadBackup()">⬇ Download Backup File</button>
      </div>
    </div>
    <div class="cloud-step">
      <div class="cloud-step-num">⬆</div>
      <div class="cloud-step-body">
        <div class="cloud-step-title">Restore from a backup</div>
        <div class="cloud-step-desc">Load a backup file. This <strong>replaces</strong> all current data with what's in the file.</div>
        <input type="file" id="backup-file-input" accept=".json,application/json" style="display:none" onchange="handleRestoreFile(event)">
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('backup-file-input').click()">⬆ Choose Backup File…</button>
        <div id="restore-status"></div>
      </div>
    </div>
    <div style="margin-top:20px"><button class="btn btn-primary" style="width:100%" onclick="closeModal()">Done</button></div>`;
  document.getElementById('modal-overlay').style.display='flex';
}
function downloadBackup(){
  try{
    const data=collectAllData();
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='meal_planner_backup_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('✓ Backup downloaded — keep it safe');
  }catch(e){
    console.error(e);
    alert('Backup failed: '+e.message);
  }
}
function handleRestoreFile(e){
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  const statusEl=document.getElementById('restore-status');
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data||!data.meals){throw new Error('This file doesn\'t look like a Meal Planner backup.');}
      const mealCount=Array.isArray(data.meals)?data.meals.length:0;
      const itemCount=Array.isArray(data.items)?data.items.length:0;
      if(!confirm(`Restore this backup?\n\nIt contains ${mealCount} meals and ${itemCount} catalog items.\n\nThis will REPLACE all current data on this device.`)){
        e.target.value='';
        return;
      }
      if(data.meals)state.meals=data.meals;
      if(data.plan)state.plan=data.plan;
      if(data.items)state.items=data.items;
      if(data.checked)state.checked=data.checked;
      if(data.qtyOvr)state.qtyOvr=data.qtyOvr;
      if(data.hiddenGen)state.hiddenGen=data.hiddenGen;
      if(data.purchases)state.purchases=data.purchases;
      if(data.dismissed)state.dismissed=data.dismissed;
      if(data.onList)state.onList=data.onList;
      if(data.storeConfig&&data.storeConfig.stores&&data.storeConfig.cats&&data.storeConfig.colors){
        STORES=data.storeConfig.stores;
        STORE_CATS=data.storeConfig.cats;
        STORE_COLOR=data.storeConfig.colors;
      }
      if(!STORES.includes(state.currentStore))state.currentStore=STORES[0];
      persist();
      renderAll();
      closeModal();
      toast(`✓ Restored ${mealCount} meals`);
    }catch(err){
      console.error(err);
      if(statusEl)statusEl.innerHTML='<div class="ai-status" style="background:#FEE2E2;color:#991B1B"><span>⚠️</span><span>'+esc(err.message)+'</span></div>';
    }
  };
  reader.onerror=()=>{if(statusEl)statusEl.innerHTML='<div class="ai-status" style="background:#FEE2E2;color:#991B1B"><span>⚠️</span><span>Could not read the file.</span></div>';};
  reader.readAsText(file);
  e.target.value='';
}

// ── HELPERS ──
function fmtQty(n){if(!n)return'';return n%1===0?n.toString():n.toFixed(1);}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
}

// ── START ──
init();
</script>
